name: iOS 打包

# 在 GitHub 的 macOS 机器上编译 iOS 包（Windows 无法编译 iOS）。
# 手动触发：仓库 → Actions → iOS 打包 → Run workflow
# 产物：rongjiu-ios-unsigned.ipa（未签名，配合 Sideloadly / AltStore 用免费 Apple ID 安装）

on:
  workflow_dispatch:
  # 打一个 ios-* 的标签就会自动出包（例：git tag ios-v1.2.0 && git push origin ios-v1.2.0）
  push:
    tags:
      - 'ios-*'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 组装 www（App 外壳 + 配方图）
        run: node tools/make-www.js

      - name: 生成 iOS 工程（同时执行 pod install）
        run: npx cap add ios

      - name: 换图标 · 锁竖屏 · 声明无加密
        run: |
          set -e
          cp icons/icon-1024.png \
             ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png

          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          plutil -lint "$PLIST"

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      - name: 打包成 ipa
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry rongjiu-ios-unsigned.ipa Payload
          ls -lh rongjiu-ios-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: rongjiu-ios-unsigned
          path: rongjiu-ios-unsigned.ipa
          if-no-files-found: error

      # 打标签时顺手发一个 Release，这样别人不用登录 GitHub 也能直接下载 ipa
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          NOTES="未签名 .ipa，iOS 不允许直接安装未知来源的应用。用 Sideloadly 或 AltStore 填自己的 Apple ID 签名后安装；免费 Apple ID 的有效期是 7 天，到期重新拖一次即可。想点开链接就装，请走 TestFlight（需要 Apple Developer 账号）。"
          gh release create "$TAG" rongjiu-ios-unsigned.ipa --title "融酒 iOS $TAG" --notes "$NOTES"
